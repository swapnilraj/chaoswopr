[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaoswopr"
version = "0.1.0"
description = "AI-driven chaos engineering tool for Ethereum operational resilience testing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "chaoswopr team" },
]

dependencies = [
    # Core
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",

    # Infrastructure
    "docker>=7.0.0",
    "kubernetes>=28.1.0",

    # Storage
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "redis>=5.0.0",

    # Monitoring
    "prometheus-client>=0.19.0",
    "prometheus-api-client>=0.5.3",
    "grafana-client>=3.5.0",
    "requests>=2.31.0",

    # Safety
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",

    # Analysis (needed for baseline scenario validation)
    "scipy>=1.11.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "testcontainers[postgres,redis,minio]>=3.7.0",
    "moto[s3]>=4.2.0",
    "responses>=0.24.0",
    "factory-boy>=3.3.0",
    "hypothesis>=6.92.0",
    "faker>=22.0.0",

    # Linting and formatting
    "ruff>=0.1.0",
    "mypy>=1.8.0",

    # Type stubs
    "types-PyYAML>=6.0",
    "types-requests>=2.31.0",
    "types-redis>=4.6.0",
    "boto3-stubs>=1.34.0",
]

[project.scripts]
chaoswopr = "chaoswopr.cli:main"
validate-scenario = "chaoswopr.scenarios.validator:main"
kill-switch = "chaoswopr.safety.kill_switch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chaoswopr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require testcontainers or external services)",
    "e2e: End-to-end tests (require full system deployment)",
    "infra: Real infrastructure tests (require Docker + Kurtosis)",
    "e2e_real: Real E2E tests (require full infrastructure deployment)",
    "slow: Tests that take >30 seconds",
    "safety: Safety-critical tests that must never be skipped",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/chaoswopr"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "@abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["chaoswopr"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
