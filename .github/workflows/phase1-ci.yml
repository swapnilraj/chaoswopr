name: Phase 1 CI Pipeline

on:
  push:
    branches: [main, "phase1/**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: MyPy type check
        run: mypy src/ --ignore-missing-imports

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ -v -m unit --tb=short --junitxml=reports/unit-results.xml
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/unit-results.xml

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chaoswopr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHAOSWOPR_DB_HOST: localhost
      CHAOSWOPR_DB_PORT: "5432"
      CHAOSWOPR_DB_NAME: chaoswopr_test
      CHAOSWOPR_DB_USER: test
      CHAOSWOPR_DB_PASSWORD: test
      CHAOSWOPR_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run integration tests
        run: pytest tests/integration/ -v -m integration --tb=short --junitxml=reports/integration-results.xml
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports/integration-results.xml

  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-test, integration-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chaoswopr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHAOSWOPR_DB_HOST: localhost
      CHAOSWOPR_DB_PORT: "5432"
      CHAOSWOPR_DB_NAME: chaoswopr_test
      CHAOSWOPR_DB_USER: test
      CHAOSWOPR_DB_PASSWORD: test
      CHAOSWOPR_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run e2e tests
        run: pytest tests/e2e/ -v -m e2e --tb=short --junitxml=reports/e2e-results.xml
      - name: Upload e2e test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: reports/e2e-results.xml

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chaoswopr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHAOSWOPR_DB_HOST: localhost
      CHAOSWOPR_DB_PORT: "5432"
      CHAOSWOPR_DB_NAME: chaoswopr_test
      CHAOSWOPR_DB_USER: test
      CHAOSWOPR_DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage (excluding real infra tests)
        run: >-
          pytest tests/unit/ tests/integration/ tests/e2e/
          --cov=src/chaoswopr --cov-report=xml --cov-report=term-missing -v
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  exit-criteria:
    name: Exit Criteria Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-test, integration-test, e2e-test, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Validate exit criteria
        run: python scripts/validate_exit_criteria.py

  # Real infrastructure tests - requires Docker and Kurtosis
  # These tests deploy real containers and Ethereum testnets.
  # They run separately from the main pipeline and take longer.
  infra-test:
    name: Real Infrastructure Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-test, integration-test]
    # Only run on main branch pushes or when explicitly triggered
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Kurtosis CLI
        run: |
          echo "deb [trusted=yes] https://apt.fury.io/kurtosis-tech/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y kurtosis-cli

      - name: Start Kurtosis engine
        run: kurtosis engine start

      - name: Validate infrastructure requirements
        run: python scripts/validate_infra_requirements.py --verbose

      - name: Run real integration tests (Docker-based)
        run: >-
          pytest tests/integration_real/ -v -m infra
          --timeout=600 --tb=short
          --junitxml=reports/infra-results.xml
        continue-on-error: true

      - name: Upload infrastructure test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-test-results
          path: reports/infra-results.xml

      - name: Cleanup Kurtosis resources
        if: always()
        run: |
          kurtosis clean -a || true
          kurtosis engine stop || true

  # Real E2E tests with full Ethereum testnet deployment
  # These are the most resource-intensive tests and run only on demand.
  e2e-real-test:
    name: Real E2E Tests (Full Testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [infra-test]
    # Only run when explicitly triggered via workflow_dispatch or label
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Kurtosis CLI
        run: |
          echo "deb [trusted=yes] https://apt.fury.io/kurtosis-tech/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y kurtosis-cli

      - name: Start Kurtosis engine
        run: kurtosis engine start

      - name: Run real E2E tests
        run: >-
          pytest tests/e2e_real/ -v -m e2e_real
          --timeout=900 --tb=short
          --junitxml=reports/e2e-real-results.xml
        continue-on-error: true

      - name: Upload E2E real test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real-test-results
          path: reports/e2e-real-results.xml

      - name: Cleanup Kurtosis resources
        if: always()
        run: |
          kurtosis clean -a || true
          kurtosis engine stop || true
